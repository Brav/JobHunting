services:
  jobhunt:
    build: .
    container_name: jobhunt
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      # The CV's folder, read-only: the container can't change the CV. A folder (not the file) so a replaced
      # CV is picked up at once, and a missing folder doesn't stop the container (and the searches) from starting.
      - type: bind
        source: ${JOBHUNT_CV_DIR:?Set JOBHUNT_CV_DIR in .env}
        target: /app/cv
        read_only: true
        bind:
          create_host_path: true
    environment:
      TZ: Europe/Belgrade
      JOBHUNT_CV_PATH: /app/cv/${JOBHUNT_CV_NAME:?Set JOBHUNT_CV_NAME in .env}
