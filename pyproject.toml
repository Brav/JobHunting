[project]
name = "jobhunt"
version = "0.1.0"
description = "Daily LinkedIn job search with a local dashboard"
readme = "README.md"
authors = [
    { name = "Brav" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "python-jobspy>=1.4.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
